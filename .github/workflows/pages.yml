# Publishes the Junior Astronaut game (public/) to GitHub Pages on every push to main,
# and once a day so the game gets fresh real space weather from NASA DONKI.
name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the last 7 days of real solar flares from NASA DONKI
        run: python3 .github/scripts/donki.py public/data/space-weather.json || true
      - name: Build site folder
        run: |
          cp -r public _site
          cat > _site/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><title>Junior Astronaut</title>
          <meta http-equiv="refresh" content="0; url=junior-astronaut/"></head>
          <body><a href="junior-astronaut/">Play Junior Astronaut</a></body></html>
          HTML
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
